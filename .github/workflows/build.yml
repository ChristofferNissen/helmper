name: build

on:
  push:
    branches:
      - main
  pull_request:

env:
  TRIVY_VERSION: 0.69.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.4
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v${{ env.TRIVY_VERSION }}/trivy_${{ env.TRIVY_VERSION }}_Linux-64bit.deb
          sudo dpkg -i trivy_${{ env.TRIVY_VERSION }}_Linux-64bit.deb
      - name: Build
        run: |
          cd cmd/helmper/
          go build
      - name: Tests
        run: |
          go test -v ./...
      - name: Run Trivy scan
        run: trivy fs --skip-dirs .devcontainer/,website/ --exit-code 1 --severity CRITICAL .
